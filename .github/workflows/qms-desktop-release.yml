name: Publish runtime-approved Desktop bytes
on:
  push:
    branches: ['release/desktop-*']
permissions:
  contents: write
concurrency:
  group: qms-desktop-component
  cancel-in-progress: false
jobs:
  publish-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Promote the exact accepted DEB; no build or functional test rerun
        run: node scripts/release/publish-desktop.mjs --publish
      - name: Preserve publication and checksum evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-evidence
          path: release/desktop/*
          if-no-files-found: warn
