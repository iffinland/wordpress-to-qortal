<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A site published on Qortal QDN" />
    <title>Qortal Site</title>
    <script>(function(){try{var raw=localStorage.getItem('qms-cms-theme@1');var mode='system';if(raw){var p=JSON.parse(raw);mode=(p&&p.mode)||p||'system';}var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;var r=mode==='light'?'light':mode==='dark'?'dark':(m?'dark':'light');document.documentElement.setAttribute('data-theme',r);document.documentElement.setAttribute('data-theme-mode',mode);document.documentElement.style.colorScheme=r;}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site requires JavaScript to render content from Qortal QDN.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
